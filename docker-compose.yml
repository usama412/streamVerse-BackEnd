services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: streamverse
      POSTGRES_USER: streamverse
      POSTGRES_PASSWORD: streamverse
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamverse -d streamverse"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  web:
    build: .
    command: sh -c "python manage.py makemigrations accounts catalog library billing blog notifications analytics && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes: [".:/app"]
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: .
    command: celery -A config worker -l info
    volumes: [".:/app"]
    env_file: .env
    depends_on: [web, redis, db]
volumes:
  postgres_data:
